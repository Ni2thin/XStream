services:
  - type: web
    name: xstream-backend
    runtime: python
    autoDeployTrigger: checksPass
    rootDir: backend
    buildCommand: python -m pip install --require-hashes -r requirements.txt
    startCommand: sh start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.18
    healthCheckPath: /health

