name: Regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx --no-install tsc --noEmit
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: npm test -- --workers=2

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13.18"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --require-hashes -r backend/requirements.txt
      - run: python -m unittest discover -s backend -v
      - run: docker build -t xstream-backend backend
      - name: Verify the container starts
        run: |
          docker run --detach --name xstream-test -p 127.0.0.1:8000:10000 xstream-backend
          trap 'docker rm -f xstream-test >/dev/null 2>&1 || true' EXIT
          for attempt in {1..15}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs xstream-test
          exit 1
